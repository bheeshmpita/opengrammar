name: Build and Push OpenGrammar Backend

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latestname: Build and Push OpenGrammar Backend

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Backend Path
        id: detect
        run: |
          if [ -d "./opengrammar/backend" ]; then
            echo "dir=./opengrammar/backend" >> $GITHUB_OUTPUT
          elif [ -d "./backend" ]; then
            echo "dir=./backend" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.detect.outputs.dir }}
          file: ${{ steps.detect.outputs.dir }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
